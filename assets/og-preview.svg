<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="SPACE SUITE · Salas de video privadas">
  <defs>
    <radialGradient id="og-glow-blue" cx="50%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#071126" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#020612" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="og-glow-mint" cx="50%" cy="36%" r="36%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071126" />
      <stop offset="100%" stop-color="#020612" />
    </linearGradient>

    <!-- Royal-blue camera monolith isotipo gradients -->
    <linearGradient id="iso-body" x1="10%" y1="5%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="48%" stop-color="#0b1f4d" />
      <stop offset="100%" stop-color="#03091a" />
    </linearGradient>
    <linearGradient id="iso-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(226, 232, 240, 0.38)" />
      <stop offset="50%" stop-color="rgba(96, 145, 255, 0.24)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.78)" />
    </linearGradient>
    <radialGradient id="iso-lens" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#081a3d" />
      <stop offset="58%" stop-color="#040c21" />
      <stop offset="100%" stop-color="#01040c" />
    </radialGradient>
    <linearGradient id="iso-s-face" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="iso-s-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.45" />
    </linearGradient>
    <clipPath id="iso-clip">
      <circle cx="70" cy="70" r="42" />
    </clipPath>
    <filter id="iso-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>
    <filter id="iso-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#01040c" flood-opacity="0.85" />
    </filter>
    <filter id="iso-s-depth" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#01040c" flood-opacity="0.82" />
    </filter>
  </defs>

  <!-- Abyssal cosmic backdrop -->
  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#og-glow-blue)" />
  <rect width="1200" height="630" fill="url(#og-glow-mint)" />

  <!-- Subtle starfield -->
  <g fill="#e2e8f0" opacity="0.35">
    <circle cx="140" cy="110" r="1.4" />
    <circle cx="245" cy="195" r="1" />
    <circle cx="330" cy="88" r="1.2" />
    <circle cx="420" cy="150" r="0.9" />
    <circle cx="790" cy="120" r="1.3" />
    <circle cx="890" cy="185" r="1" />
    <circle cx="1015" cy="95" r="1.5" />
    <circle cx="1080" cy="240" r="1.1" />
    <circle cx="180" cy="490" r="1.1" />
    <circle cx="290" cy="540" r="1.4" />
    <circle cx="940" cy="510" r="1.2" />
    <circle cx="1060" cy="465" r="0.9" />
  </g>

  <!-- Centered Royal-Blue Isotipo -->
  <g transform="translate(495, 118) scale(1.5)" filter="url(#iso-shadow)">
    <rect x="4" y="4" width="132" height="132" rx="32" fill="url(#iso-body)" stroke="url(#iso-bevel)" stroke-width="2" />
    <rect x="9" y="9" width="122" height="122" rx="28" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="70" cy="70" r="46" fill="#020714" stroke="rgba(148,163,184,0.22)" stroke-width="1.5" />
    <circle cx="70" cy="70" r="42" fill="url(#iso-lens)" />

    <g clip-path="url(#iso-clip)">
      <g transform="rotate(-28 70 70)" filter="url(#iso-blur)">
        <ellipse cx="70" cy="70" rx="34" ry="13" fill="none" stroke="#34d399" stroke-width="2.2" stroke-opacity="0.34" />
      </g>
      <g transform="rotate(34 70 70)" filter="url(#iso-blur)">
        <ellipse cx="70" cy="70" rx="32" ry="11" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-opacity="0.26" />
      </g>
      <ellipse cx="70" cy="70" rx="34" ry="13" transform="rotate(-28 70 70)" fill="none" stroke="rgba(110,231,183,0.16)" stroke-width="0.9" />
      <ellipse cx="70" cy="70" rx="32" ry="11" transform="rotate(34 70 70)" fill="none" stroke="rgba(52,211,153,0.14)" stroke-width="0.9" />
    </g>

    <g filter="url(#iso-s-depth)">
      <text
        x="70"
        y="89"
        text-anchor="middle"
        font-family="'Quicksand', 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
        font-weight="700"
        font-size="56"
        fill="url(#iso-s-face)"
        stroke="url(#iso-s-rim)"
        stroke-width="1.1"
      >S</text>
    </g>

    <!-- Live emerald LED -->
    <circle cx="118" cy="22" r="4.5" fill="#34d399" stroke="#a7f3d0" stroke-width="1" />
  </g>

  <!-- Brand title + tagline inside translucent royal-blue glass pill container -->
  <rect x="240" y="384" width="720" height="86" rx="18" fill="rgba(12, 28, 68, 0.55)" stroke="rgba(96, 145, 255, 0.22)" stroke-width="1.2" />
  <text
    x="600"
    y="438"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="31"
    letter-spacing="0.4"
  >
    <tspan font-weight="800" fill="#f8fafc">SPACE SUITE</tspan>
    <tspan font-weight="700" fill="#34d399"> · </tspan>
    <tspan font-weight="500" fill="#cbd5e1">Salas de video privadas</tspan>
  </text>

  <text
    x="600"
    y="516"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="21"
    font-weight="500"
    fill="#94a3b8"
  >Entra a tu Suite privada sin barreras.</text>
</svg>
