name = "spacesuite"
pages_build_output_dir = "."
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Bindings recomendados en Cloudflare Pages -> Settings -> Bindings:
# 1) D1 database: variable = "DB", database = "spacesuite-db"
# 2) Durable Object (opcional tras desplegar wrangler.do.toml): variable = "ROOM_DO", class = "RoomDurableObject", script = "spacesuite-do"
